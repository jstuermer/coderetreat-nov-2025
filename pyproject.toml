[project]
name = "coderetreat-nov-2025"
version = "0.1.0"
description = "Conway's game of life"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "ruff>=0.14.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812"] # do not enforce trailing commas

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # allow asserts in tests

[tool.mypy]
strict = true
exclude = ".venv"
mypy_path = ["src"]
